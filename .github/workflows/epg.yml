name: 同步 EPG

# 已停用定时同步：EPG 统一从 IPTV 仓库直接读，不再往本仓库复制一份。
# 播放器里请直接把 EPG 地址设为 IPTV 仓库的 e_all.xml（见 README）。
# 留 workflow_dispatch 只是为了需要时能手动补一次。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 IPTV 仓库生成的 EPG
        run: |
          # 拉 e_all.xml 而不是 e.xml：
          #   e.xml     = 只有国内频道（615 个）
          #   e_all.xml = e.xml + 港澳台（652 个，由 IPTV 仓库那边的
          #               build_epg.py 合并 epg.pw 的香港/台湾节目单生成）
          # 这样本站 EPG 也统一从 IPTV 仓库读，不再分几个源
          curl -sL --max-time 300 -o output/epg.new.xml \
            "https://raw.githubusercontent.com/zengzifeng520/IPTV/gh-pages/e_all.xml"
          size=$(wc -c < output/epg.new.xml 2>/dev/null || echo 0)
          echo "下载 EPG: $size 字节"
          if [ "$size" -lt 100000 ]; then
            echo "::error::EPG 异常（$size 字节），本轮不更新"
            exit 1
          fi
          head -c 200 output/epg.new.xml | grep -q "<?xml" || { echo "::error::不是有效 XML"; exit 1; }
          mv output/epg.new.xml output/epg.xml
      - name: 提交
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/epg.xml
          if git diff --staged --quiet; then echo "EPG 无变化，跳过提交"; exit 0; fi
          git commit -m "Auto-sync EPG from IPTV repo"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
              echo "推送成功（第 $attempt 次）"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::连续 5 次推送失败"; exit 1
    env:
      TZ: Asia/Shanghai
