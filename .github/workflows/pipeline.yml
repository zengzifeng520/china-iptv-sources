name: 更新订阅

on:
  # 定时由「巡检并更新订阅」在巡检完成后触发，这里不再单独定时
  # 仅保留：用户增删（users.json 变更）自动触发 + 手动触发
  push:
    paths:
      - "nas/users.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行订阅管线
        env:
          GH_TOKEN: ${{ github.token }}
        run: python github/run_pipeline.py
