name: 更新订阅

on:
  schedule:
    # 北京时间 07:00-18:00 每小时推送（UTC 23 点 + 0-10 点，分钟 20）
    - cron: "20 23,0-10 * * *"
    # 北京时间 19:00-22:30 每半小时推送（UTC 11-14 点，分钟 20/50）
    - cron: "20,50 11-14 * * *"
    # 北京时间 23:00 收尾一次（UTC 15 点）
    - cron: "20 15 * * *"
  push:
    paths:
      - "nas/users.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行订阅管线
        env:
          GH_TOKEN: ${{ github.token }}
        run: python github/run_pipeline.py
